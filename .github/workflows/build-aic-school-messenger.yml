name: Build AIC School Messenger APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-messenger/**'
      - '.github/workflows/build-aic-school-messenger.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p android-messenger :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aic-school-messenger-debug-apk
          path: android-messenger/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
